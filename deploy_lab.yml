---
- name: "🌐 NetDevOps: Samonaprawiająca się sieć OSPF z Fail-Safe EEM"
  hosts: all
  gather_facts: no
  connection: network_cli
  vars:
    alert_webhook_url: ""
    ansible_server_ip: "192.168.1.127"

  tasks:
    - name: "BLOCK: Próba wdrożenia i weryfikacji"
      block:
        - name: "[1] Optymalizacja systemu plików (Silent Copy)"
          cisco.ios.ios_config:
            lines:
              - file prompt quiet

        - name: "[1.5] Enforce Physical Interface States (no shutdown)"
          cisco.ios.ios_interfaces:
            config:
              - name: "{{ mgmt_interface }}"
                enabled: true
            state: merged
          when: mgmt_interface is defined

        - name: "[2] Konfiguracja OSPF (Źródło Prawdy: NetBox)"
          cisco.ios.ios_ospfv2:
            config:
              processes:
                - process_id: 1
                  areas:
                    - area_id: "0"
            state: merged
          register: ospf_config

        - name: "[2.5] Aktywacja monitoringu (SNMP)"
          cisco.ios.ios_config:
            lines:
              - snmp-server community public RO

        - name: "[3.1] Usunięcie starych strażników"
          cisco.ios.ios_config:
            lines:
              - no event manager applet ANSIBLE_SAFEGUARD
              - no ip sla 10
              - no track 10
          ignore_errors: yes

        - name: "[3.2] Uzbrojenie uniwersalnego strażnika (EEM Timer)"
          cisco.ios.ios_config:
            parents: event manager applet ANSIBLE_SAFEGUARD
            lines:
              - event timer watchdog time 60
              - action 1.0 cli command "enable"
              - action 2.0 cli command "ping {{ ansible_server_ip }} source {{ mgmt_interface }} repeat 2 timeout 1"
              - action 3.0 regexp "!!" "$_cli_result"
              - action 4.0 if $_regexp_result eq "0"
              - action 5.0 syslog msg "🚨 CONNECTION LOST! Forcing {{ mgmt_interface }} UP..."
              - action 6.0 cli command "configure terminal"
              - action 7.0 cli command "interface {{ mgmt_interface }}"
              - action 8.0 cli command "no shutdown"
              - action 9.0 cli command "end"
              - action 10.0 cli command "copy startup-config running-config"
              - action 11.0 end
          register: eem_config
          when: mgmt_interface is defined

        - name: "[4] Zapisywanie konfiguracji do Startup-Config"
          cisco.ios.ios_command:
            commands: write memory
          when: (ospf_config.changed | default(false)) or (eem_config.changed | default(false))

        - name: "[5] Walidacja: Sprawdzenie stanu sąsiedztwa OSPF"
          cisco.ios.ios_command:
            commands: show ip ospf neighbor
          register: ospf_neighbors

        - name: "[6] Raportowanie stanu operacyjnego"
          debug:
            msg: "Urządzenie {{ inventory_hostname }} jest ZGODNE. Sąsiedzi OSPF:\n{{ ospf_neighbors.stdout[0] }}"

      rescue:
        - name: "🚨 ALERT: Błąd krytyczny podczas wdrożenia"
          debug:
            msg: "NIE POWIODŁO SIĘ wdrożenie na {{ inventory_hostname }}. Lokalny EEM czuwa nad łącznością."

      always:
        - name: "[ChatOps] Powiadomienie o sukcesie (tylko przy zmianach)"
          uri:
            url: "{{ alert_webhook_url }}"
            method: POST
            body_format: json
            headers:
              Content-Type: "application/json"
            body:
              content: "✅ **Auto-Healed!**\nSieć na **{{ inventory_hostname }}** została automatycznie naprawiona i zwalidowana."
          when: 
            - ospf_config is defined and ospf_config.changed
            - alert_webhook_url != ""
          ignore_errors: yes
