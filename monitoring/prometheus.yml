global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'snmp'
    static_configs:
      - targets:
        - 10.0.31.1   # R1
        - 10.0.22.2   # R2
        - 10.0.11.10  # SW1
        - 10.0.12.2   # SW2
        - 10.0.31.10  # SW3
    metrics_path: /snmp
    params:
      module: [if_mib]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116
